<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="tela_cadastro.css" rel="stylesheet">
    <title>Cadastro de usuário</title>
</head>
<body>
    <div class="cadastro-container"> <!-- container para o formulário de cadastro de usuário,aqui posso ajustar cor, centralização de textos e etc. -->
        <h1>Cadastro de usuário</h1>
        <form> <!-- formulario de cadastro de usuario, com campos para nome, email e senha -->
            <label for="name">Nome:</label><br>
            <input type="text" id="name" name="name"><br><br>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email"><br><br>
            <label for="password">Senha:</label><br>
            <input type="password" id="password" name="password"><br><br>
            <input type="submit" value="Cadastrar">
        </form>
    </div>
</body>
</html>
