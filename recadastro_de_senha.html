<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="recadastro_de_senha.css" rel="stylesheet">
    <title>Recadastro de senha</title>
</head>
<body>
    

    <div class="recadastro-container">
        <h1 class="recadastro-h1">Recadastro de senha</h1><br>
        <form>
            <label for="password">Digite sua nova senha:</label><br>
            <input type="password" id="password" name="password"><br><br>
            <label for="confirm-password">Confirme sua nova senha:</label><br>
            <input type="password" id="confirm-password" name="confirm-password"><br><br>
            <input type="submit" value="Recadastrar senha">
        </form>
    
</body>
</html>
